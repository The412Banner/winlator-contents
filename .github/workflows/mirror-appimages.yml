name: Mirror ARM64 AppImages (SteamDeck)

# Tier-2 emulators: upstream's own aarch64 Linux builds, copied to our release so the catalog can
# point at a URL that does not move and a checksum that was taken here. Nothing is modified.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to publish to'
        required: true
        default: 'steamdeck-desktop-r1'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p out && cd out
          # id  upstream url. Only what is being added: every file listed is re-fetched and replaces
          # the release copy, and a moving upstream link (DuckStation's "latest") would no longer
          # match its checksum in desktop.json. Mirrored before: rpcs3 (build 9e86f165), duckstation
          # (latest @ 2026-09-20), melonds (1.1), armsx2 (nightly-20260923, 4K pages).
          while read -r id url; do
            [ -n "$id" ] || continue
            ext=${url##*.}
            curl -fsSL --retry 5 --retry-delay 10 -o "$id.$ext" "$url"
            sha256sum "$id.$ext" | awk '{print $1}' > "$id.sha256"
            echo "  $id $(stat -c %s "$id.$ext") $(cat "$id.sha256") $id.$ext"
          done <<'LIST'
          armsx2-16k https://github.com/ARMSX2/ARMSX2/releases/download/nightly-20260923/ARMSX2-nightly-20260923-92aa2174da-Linux-arm64-16K-pages.AppImage
          LIST
          gh release upload '${{ inputs.release }}' ./* --clobber
